services:
  relay:
    build:
      context: .
      target: relay
    restart: unless-stopped
    environment:
      CLAUDE_SERVICE_URL: http://claude:3100
      BAILEYS_LOG_LEVEL: "${BAILEYS_LOG_LEVEL:-error}"
    volumes:
      - auth_info:/app/auth_info
    stdin_open: true
    tty: true
    depends_on:
      claude:
        condition: service_healthy
    networks:
      - relay-net

  claude:
    build:
      context: .
      target: claude
    restart: unless-stopped
    environment:
      CLAUDE_TIMEOUT: "${CLAUDE_TIMEOUT:-300}"
      BRIDGE_PORT: "3100"
    volumes:
      - claude_home:/home/claude
    networks:
      - relay-net

networks:
  relay-net:

volumes:
  auth_info:
  claude_home:
